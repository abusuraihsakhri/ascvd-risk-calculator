name: ASCVD Risk Calculator CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: CLI Single Calculation Smoke Test
      run: |
        python cli.py calculate --age 55 --sex male --race white --tc 213 --hdl 50 --sbp 120 --lifetime --json

    - name: CLI Batch Processing Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv
        python -c "import csv; rows = list(csv.DictReader(open('out_smoke.csv'))); assert len(rows) == 8, f'Expected 8 rows, got {len(rows)}'"
        rm out_smoke.csv
